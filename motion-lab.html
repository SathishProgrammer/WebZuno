<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webzuno — 3D motion lab (prototype)</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/logo-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070b;
      --panel: rgba(255, 255, 255, 0.03);
      --line: rgba(255, 255, 255, 0.08);
      --text: #e9f0f7;
      --muted: #7f8c9b;
      --accent: #9fd4ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: radial-gradient(ellipse at 50% 40%, #0c1522 0%, var(--bg) 65%);
      color: var(--text);
      font-family: Manrope, system-ui, sans-serif;
      overflow: hidden;
    }
    button { font: inherit; color: inherit; cursor: pointer; }

    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 28px;
    }
    .top h1 { margin: 0; font-family: Syne, sans-serif; font-size: 17px; }
    .top h1 span { color: var(--muted); font-weight: 500; }
    .opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
    }
    .btn:hover, .btn.on { border-color: rgba(159, 212, 255, 0.5); }
    .btn.on { background: rgba(159, 212, 255, 0.12); }

    .stage { position: fixed; inset: 0; }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

    .list {
      position: fixed;
      left: 28px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 4;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .list button {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: none;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-align: left;
      transition: color 0.25s;
    }
    .list button i {
      font-style: normal;
      font-size: 11px;
      width: 22px;
      opacity: 0.6;
    }
    .list button::before {
      content: "";
      width: 18px;
      height: 1px;
      background: currentColor;
      transition: width 0.3s;
    }
    .list button.on { color: var(--text); }
    .list button.on::before { width: 36px; background: var(--accent); }

    .word {
      position: fixed;
      left: 28px;
      bottom: 34px;
      z-index: 4;
      pointer-events: none;
    }
    .word h2 {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(48px, 9vw, 128px);
      line-height: 0.9;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #8fcfff 0%, #ffffff 55%, #cfe6ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: opacity 0.45s, transform 0.45s;
    }
    .word p { margin: 10px 0 0 4px; color: var(--muted); font-size: 15px; transition: opacity 0.45s; }
    .word.swap h2 { opacity: 0; transform: translateY(14px); }
    .word.swap p { opacity: 0; }

    .hint {
      position: fixed;
      right: 28px;
      bottom: 34px;
      z-index: 4;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      line-height: 1.6;
    }

    /* "In hero" layout: shows the effect where it would sit on the real site */
    .hero-copy { display: none; }
    body.hero-mode .stage { left: 46%; }
    body.hero-mode .list { left: auto; right: 28px; }
    body.hero-mode .list button { flex-direction: row-reverse; text-align: right; }
    body.hero-mode .word { left: 50%; }
    body.hero-mode .word h2 { font-size: clamp(36px, 5vw, 72px); }
    body.hero-mode .hint { display: none; }
    body.hero-mode .hero-copy {
      display: block;
      position: fixed;
      left: 6vw;
      top: 50%;
      transform: translateY(-50%);
      width: 38vw;
      z-index: 4;
    }
    .hero-copy .eyebrow { color: var(--accent); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 14px; }
    .hero-copy h3 { font-family: Syne, sans-serif; font-size: clamp(36px, 4.4vw, 64px); line-height: 1.02; margin: 0 0 18px; }
    .hero-copy h3 span { background: linear-gradient(90deg, #6edcff, #b9a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero-copy p { color: var(--muted); font-size: 17px; max-width: 30em; margin: 0 0 26px; }
    .hero-copy .cta { display: inline-block; background: #6edcff; color: #04121a; font-weight: 700; padding: 12px 22px; border-radius: 999px; font-size: 14px; }

    @media (max-width: 760px) {
      .list { top: auto; bottom: 150px; transform: none; }
      .list button { padding: 4px 0; font-size: 12px; }
      .hint { display: none; }
      body.hero-mode .stage { left: 0; top: 40%; }
      body.hero-mode .hero-copy { width: auto; right: 6vw; top: 90px; transform: none; }
    }
  </style>
</head>
<body>
  <div class="stage"><canvas id="c"></canvas></div>

  <header class="top">
    <h1>3D motion lab <span>· prototype</span></h1>
    <div class="opts">
      <button class="btn on" id="auto">Auto-play</button>
      <button class="btn" id="palette">Colour: Ice white</button>
      <button class="btn" id="layout">Show in hero</button>
    </div>
  </header>

  <nav class="list" id="list"></nav>

  <div class="hero-copy">
    <p class="eyebrow">Web design for local businesses</p>
    <h3>Your business.<br><span>Built for the web.</span></h3>
    <p>Modern websites for shops, clinics, restaurants and local teams who are ready to be found.</p>
    <span class="cta">Build My Website →</span>
  </div>

  <div class="word" id="word"><h2 id="word-h"></h2><p id="word-p"></p></div>
  <p class="hint">Move your mouse to tilt<br>Click a name or use ← → keys</p>

  <script>
  (() => {
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const small = window.innerWidth < 760;
    const N = small ? 1331 : 2744;
    const G = Math.round(Math.cbrt(N));
    const TAU = Math.PI * 2;
    const golden = Math.PI * (3 - Math.sqrt(5));

    const hash = (seed) => Float32Array.from({ length: N }, (_, i) => {
      const s = Math.sin(i * 12.9898 + seed * 78.233) * 43758.5453;
      return s - Math.floor(s);
    });
    const H1 = hash(1);
    const H2 = hash(2);
    const H3 = hash(3);

    const rotX = (p, a) => { const c = Math.cos(a), s = Math.sin(a); const y = p[1] * c - p[2] * s; p[2] = p[1] * s + p[2] * c; p[1] = y; };
    const rotY = (p, a) => { const c = Math.cos(a), s = Math.sin(a); const x = p[0] * c + p[2] * s; p[2] = -p[0] * s + p[2] * c; p[0] = x; };
    const rotZ = (p, a) => { const c = Math.cos(a), s = Math.sin(a); const x = p[0] * c - p[1] * s; p[1] = p[0] * s + p[1] * c; p[0] = x; };
    const set = (p, x, y, z) => { p[0] = x; p[1] = y; p[2] = z; };

    const wCols = Math.ceil(Math.sqrt(N * 1.5));
    const wRows = Math.ceil(N / wCols);
    const iRows = 18;
    const iCols = Math.ceil(N / iRows);
    const lemniscate = (q) => {
      const d = 1 + Math.sin(q) * Math.sin(q);
      return [(1.2 * Math.cos(q)) / d, (1.2 * Math.sin(q) * Math.cos(q)) / d];
    };

    const EFFECTS = [
      {
        id: "cube", word: "MODULAR", line: "Websites built from solid blocks",
        fn: (i, t, p) => {
          const a = i % G, b = Math.floor(i / G) % G, c = Math.floor(i / (G * G)) % G;
          const s = 1.35 / (G - 1);
          set(p, (a - (G - 1) / 2) * s, (b - (G - 1) / 2) * s, (c - (G - 1) / 2) * s);
          rotY(p, t * 0.28 + 0.6);
          rotX(p, 0.42 + Math.sin(t * 0.3) * 0.12);
        }
      },
      {
        id: "wave", word: "FLOW", line: "Smooth on every screen",
        fn: (i, t, p) => {
          const a = i % wCols, b = Math.floor(i / wCols);
          const x = (a / (wCols - 1) - 0.5) * 3.4;
          const z = (b / (wRows - 1) - 0.5) * 2.2;
          const y = 0.24 * Math.sin(x * 1.7 + t * 1.0) + 0.16 * Math.sin(z * 2.4 + t * 0.75 + x * 0.6) + 0.07 * Math.sin((x - z) * 3.4 - t * 1.5);
          set(p, x, -y, z);
          rotY(p, Math.sin(t * 0.12) * 0.25 - 0.18);
          rotX(p, 0.52);
        }
      },
      {
        id: "sphere", word: "GLOBAL", line: "Reach customers anywhere",
        fn: (i, t, p) => {
          const yy = 1 - (2 * (i + 0.5)) / N;
          const r = Math.sqrt(1 - yy * yy);
          const th = golden * i;
          const bump = 1 + 0.045 * Math.sin(yy * 9 + th * 0.002 + t * 2.2);
          set(p, Math.cos(th) * r * bump * 1.05, yy * bump * 1.05, Math.sin(th) * r * bump * 1.05);
          rotY(p, t * 0.22);
          rotX(p, 0.28);
        }
      },
      {
        id: "helix", word: "CONNECTED", line: "Every part of your business, linked",
        fn: (i, t, p) => {
          const turns = 3;
          if (H1[i] < 0.7) {
            const u = H2[i];
            const ang = u * TAU * turns + (i % 2) * Math.PI + t * 0.8;
            const rad = 0.42 + (H3[i] - 0.5) * 0.07;
            set(p, Math.cos(ang) * rad, (u - 0.5) * 2.2 + (H3[i] - 0.5) * 0.04, Math.sin(ang) * rad);
          } else {
            const rungs = 30;
            const u = (Math.floor(H2[i] * rungs) + 0.5) / rungs;
            const ang = u * TAU * turns + t * 0.8;
            const f = H3[i] * 2 - 1;
            set(p, Math.cos(ang) * 0.42 * f, (u - 0.5) * 2.2, Math.sin(ang) * 0.42 * f);
          }
          rotZ(p, 0.55);
          rotX(p, 0.25);
        }
      },
      {
        id: "infinity", word: "INFINITE", line: "Endless possibilities online",
        fn: (i, t, p) => {
          const a = i % iCols, b = Math.floor(i / iCols);
          const u = (a / iCols) * TAU + t * 0.35;
          const v = (b / iRows) * TAU;
          const [x, y] = lemniscate(u);
          const [x2, y2] = lemniscate(u + 0.002);
          const l = Math.hypot(x2 - x, y2 - y) || 1;
          const nx = -(y2 - y) / l;
          const ny = (x2 - x) / l;
          const r = 0.16;
          set(p, x + nx * r * Math.cos(v), y + ny * r * Math.cos(v), r * Math.sin(v) + 0.2 * Math.sin(u));
          rotX(p, 0.45 + Math.sin(t * 0.25) * 0.15);
          rotY(p, Math.sin(t * 0.2) * 0.45);
        }
      },
      {
        id: "ripple", word: "IMPACT", line: "Every visit makes a ripple",
        fn: (i, t, p) => {
          const a = i % wCols, b = Math.floor(i / wCols);
          const x = (a / (wCols - 1) - 0.5) * 3.0;
          const z = (b / (wRows - 1) - 0.5) * 2.2;
          const d = Math.hypot(x, z);
          const y = 0.26 * Math.sin(d * 6 - t * 2.6) * Math.exp(-d * 0.85);
          set(p, x, -y, z);
          rotY(p, t * 0.08);
          rotX(p, 0.6);
        }
      },
      {
        id: "galaxy", word: "STAND OUT", line: "Shine in a crowded market",
        fn: (i, t, p) => {
          const arms = 4;
          const r = 0.08 + Math.pow(H1[i], 0.75) * 1.2;
          const ang = (i % arms) * (TAU / arms) + r * 2.8 + (H2[i] - 0.5) * 0.45 * (1.4 - r) - t * 0.18;
          const rr = r + (H3[i] - 0.5) * 0.08;
          set(p, Math.cos(ang) * rr, (H3[i] - 0.5) * 0.12 * (1.4 - r), Math.sin(ang) * rr);
          rotX(p, 0.95);
          rotZ(p, 0.22);
        }
      }
    ];

    const PALETTES = [
      { name: "Ice white", rgb: [196, 222, 255], word: ["#8fcfff", "#ffffff", "#cfe6ff"] },
      { name: "Webzuno cyan", rgb: [110, 220, 255], word: ["#6edcff", "#bff1ff", "#b9a6ff"] }
    ];
    let paletteIdx = 0;
    const sprite = document.createElement("canvas");
    const makeSprite = () => {
      const [r, g, b] = PALETTES[paletteIdx].rgb;
      sprite.width = sprite.height = 64;
      const s = sprite.getContext("2d");
      const grd = s.createRadialGradient(32, 32, 0, 32, 32, 32);
      grd.addColorStop(0, "rgba(255,255,255,1)");
      grd.addColorStop(0.16, `rgba(${r},${g},${b},1)`);
      grd.addColorStop(0.4, `rgba(${r},${g},${b},0.22)`);
      grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
      s.clearRect(0, 0, 64, 64);
      s.fillStyle = grd;
      s.fillRect(0, 0, 64, 64);
      const [c1, c2, c3] = PALETTES[paletteIdx].word;
      document.getElementById("word-h").style.backgroundImage = `linear-gradient(90deg, ${c1} 0%, ${c2} 55%, ${c3} 100%)`;
    };
    makeSprite();

    let W = 0, Hh = 0;
    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth;
      Hh = canvas.clientHeight;
      canvas.width = W * dpr;
      canvas.height = Hh * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    new ResizeObserver(resize).observe(canvas);
    resize();

    const list = document.getElementById("list");
    EFFECTS.forEach((e, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.innerHTML = `<i>${String(i + 1).padStart(2, "0")}</i>${e.word.charAt(0) + e.word.slice(1).toLowerCase()} <span style="opacity:.5;font-weight:500">· ${e.id}</span>`;
      b.addEventListener("click", () => goTo(i));
      list.appendChild(b);
    });

    const word = document.getElementById("word");
    const setWord = (i) => {
      word.classList.add("swap");
      setTimeout(() => {
        document.getElementById("word-h").textContent = EFFECTS[i].word;
        document.getElementById("word-p").textContent = EFFECTS[i].line;
        word.classList.remove("swap");
      }, 380);
      [...list.children].forEach((b, k) => b.classList.toggle("on", k === i));
    };

    let cur = 0;
    let next = 0;
    let morph = 1;
    let hold = 0;
    let auto = true;
    const HOLD = 6.5;
    const MORPH = 2.2;
    const goTo = (i) => {
      if (i === next) return;
      if (morph < 1) cur = next;
      next = i;
      morph = 0;
      hold = 0;
      setWord(i);
    };
    const wanted = new URLSearchParams(location.search).get("fx") || location.hash.slice(1);
    const start = EFFECTS.findIndex((e) => e.id === wanted);
    if (start > 0) cur = next = start;
    if (new URLSearchParams(location.search).has("still")) {
      auto = false;
      document.getElementById("auto").classList.remove("on");
    }
    setWord(cur);

    document.getElementById("auto").addEventListener("click", (e) => {
      auto = !auto;
      hold = 0;
      e.currentTarget.classList.toggle("on", auto);
    });
    document.getElementById("palette").addEventListener("click", (e) => {
      paletteIdx = (paletteIdx + 1) % PALETTES.length;
      e.currentTarget.textContent = `Colour: ${PALETTES[paletteIdx].name}`;
      makeSprite();
    });
    document.getElementById("layout").addEventListener("click", (e) => {
      const on = document.body.classList.toggle("hero-mode");
      e.currentTarget.classList.toggle("on", on);
      e.currentTarget.textContent = on ? "Show full stage" : "Show in hero";
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") goTo((next + 1) % EFFECTS.length);
      if (e.key === "ArrowLeft") goTo((next - 1 + EFFECTS.length) % EFFECTS.length);
    });

    let mx = 0, my = 0, tmx = 0, tmy = 0;
    window.addEventListener("pointermove", (e) => {
      tmx = e.clientX / window.innerWidth - 0.5;
      tmy = e.clientY / window.innerHeight - 0.5;
    });

    const A = [0, 0, 0];
    const B = [0, 0, 0];
    const D = 3.6;
    let t = 0;
    let last = performance.now();
    const frame = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      t += dt;
      if (morph < 1) {
        morph = Math.min(1, morph + dt / MORPH);
        if (morph >= 1) cur = next;
      } else if (auto) {
        hold += dt;
        if (hold >= HOLD) goTo((next + 1) % EFFECTS.length);
      }
      mx += (tmx - mx) * 0.05;
      my += (tmy - my) * 0.05;

      ctx.clearRect(0, 0, W, Hh);
      ctx.globalCompositeOperation = "lighter";
      const f = Math.min(W, Hh) * 0.95;
      const cx = W * 0.5;
      const cy = Hh * 0.48;
      const fa = EFFECTS[cur].fn;
      const fb = EFFECTS[next].fn;
      const morphing = morph < 1;

      for (let i = 0; i < N; i += 1) {
        fa(i, t, A);
        if (morphing) {
          fb(i, t, B);
          let k = Math.min(1, Math.max(0, morph * 1.45 - H1[i] * 0.45));
          k = k * k * (3 - 2 * k);
          A[0] += (B[0] - A[0]) * k;
          A[1] += (B[1] - A[1]) * k;
          A[2] += (B[2] - A[2]) * k;
        }
        rotY(A, mx * 0.5);
        rotX(A, my * 0.3);
        const zz = A[2] + D;
        if (zz < 0.3) continue;
        const s = f / zz;
        const depth = Math.min(1, Math.max(0, (D + 1.3 - zz) / 2.6));
        const size = (1.1 + depth * 2.8) * 2.3;
        ctx.globalAlpha = 0.12 + depth * 0.78;
        ctx.drawImage(sprite, cx + A[0] * s - size / 2, cy + A[1] * s - size / 2, size, size);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
